
name: Build VYRON APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: vyron-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      # Automatically accepts Android SDK licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # 4. Configure Gradle and caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
          cache-cleanup: on-success

      # 5. Verify build environment
      - name: Check build environment
        run: |
          java -version
          gradle --version
          sdkmanager --version

      # 6. Build debug APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon clean :app:assembleDebug

      # 7. Build release APK
      - name: Build Release APK
        run: |
          gradle --no-daemon :app:assembleRelease

      # 8. Upload installable debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-IDE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 9. Upload release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-IDE-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30
