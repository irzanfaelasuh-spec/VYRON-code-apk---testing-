<style>
:root{--bg:#1e1e1e;--side:#252526;--act:#333;--tab:#2d2d2d;--tit:#3c3c3c;--bd:#3c3c3c;--fg:#d4d4d4;--mut:#858585;--acc:#007acc;--sel:#37373d;--cm:#6a9955;--st:#ce9178;--nu:#b5cea8;--kw:#569cd6;--fn:#dcdcaa;--at:#9cdcfe;--mono:Consolas,Menlo,"Courier New",monospace;--fs:14px;--lh:22px;--ts:2;--e:cubic-bezier(.2,.8,.2,1)}
[data-t=light]{--bg:#fff;--side:#f3f3f3;--act:#2c2c2c;--tab:#ececec;--tit:#ddd;--bd:#d4d4d4;--fg:#333;--mut:#777;--sel:#e4e6f1;--cm:#008000;--st:#a31515;--nu:#098658;--kw:#0000ff;--fn:#795e26;--at:#e50000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--acc);outline-offset:-1px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hid{display:none!important}.mut{color:var(--mut)}.sp{flex:1}
@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes fi{to{opacity:1}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes ld{to{width:100%}}
.scr{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#252a33,#16171a);color:#ddd;transition:opacity .5s var(--e)}
.scr.off{opacity:0;visibility:hidden;transition:opacity .5s var(--e),visibility 0s .5s}
#sp .lgo svg{width:120px;height:120px;overflow:visible}#sp rect{opacity:0;animation:fi 1s 1.6s forwards}
#sp path{stroke-dasharray:80;stroke-dashoffset:80;animation:dr 1.6s .2s var(--e) forwards}
.bn{margin:20px 0 0;font-weight:200;font-size:34px;letter-spacing:.2em;opacity:0;animation:fi .8s 1.2s forwards}.bn span{color:#4fc1ff}
.bar{width:180px;height:3px;background:#ffffff1a;border-radius:3px;margin-top:28px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#007acc;animation:ld 4s linear forwards}
.card{width:min(360px,88vw);padding:28px 26px;background:#252526;border:1px solid #3c3c3c;border-radius:10px;box-shadow:0 20px 60px #000a;animation:up .6s var(--e);transition:border-color .2s,box-shadow .3s}
.card h2{margin:0 0 20px;font-weight:300;font-size:24px;display:flex;align-items:center;gap:10px}.card h2 svg{width:26px;height:26px}
.card label{font-size:12px;color:#9a9a9a}
.card input{width:100%;margin:6px 0 14px;padding:11px 12px;font-size:16px;background:#1e1e1e;border:1px solid #3c3c3c;border-radius:6px;outline:0;color:#ddd;transition:border-color .2s,box-shadow .2s}
.card input:focus{border-color:#007acc;box-shadow:0 0 0 3px #007acc33}
.card.err{border-color:#f14c4c;box-shadow:0 0 44px #f14c4c55,0 20px 60px #000a}.card.err input{border-color:#f14c4c;box-shadow:0 0 0 3px #f14c4c33}
#em{color:#f14c4c;min-height:18px;font-size:12.5px;margin:-6px 0 10px}
.btn{width:100%;padding:11px;background:#007acc;color:#fff;border-radius:6px;font-weight:600;transition:filter .15s,transform .1s}.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.98)}
#fl{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,#f14c4c99)}
#wl h1{font-weight:200;font-size:clamp(28px,7vw,52px);margin:0;animation:up .8s var(--e)}#wl b{font-weight:600;color:#4fc1ff}
#ide{position:fixed;inset:0;display:none;grid-template-rows:35px minmax(0,1fr) 22px}#ide.on{display:grid;animation:fade .6s}
#tb{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--tit)}#tb b{font-weight:600;letter-spacing:.06em}#tb .lgo{display:flex;width:18px}
#cc{display:flex;gap:8px;align-items:center;justify-content:center;min-width:min(340px,40vw);padding:3px 14px;margin:0 auto;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--mut)}#cc svg.i{width:15px;height:15px}
#tb button:hover{color:var(--acc)}#un{color:var(--mut)}
#mn{display:flex;min-height:0;position:relative}
#ab{width:48px;background:var(--act);display:flex;flex-direction:column;z-index:6;flex:none}
#ab button{width:48px;height:48px;display:grid;place-items:center;color:#858585;border-left:2px solid transparent;transition:color .15s,border-color .15s}#ab button:hover,#ab button.on{color:#fff}#ab button.on{border-color:#fff}
#sb{width:260px;background:var(--side);border-right:1px solid var(--bd);overflow:hidden;transition:width .22s var(--e),transform .22s var(--e);flex:none;z-index:5}#sb.c{width:0;border-width:0}
#sbi{width:260px;height:100%;display:flex;flex-direction:column}
#sbh{height:35px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;font-size:11px;letter-spacing:.06em;color:var(--mut)}
#sbh button,.ra button{width:24px;height:24px;display:grid;place-items:center;color:var(--fg);border-radius:4px;transition:background .12s}#sbh button:hover,.ra button:hover{background:#ffffff1f}#sbh svg.i,.ra svg.i{width:16px;height:16px}
#sbc{flex:1;overflow:auto}
.r{display:flex;align-items:center;gap:6px;height:26px;padding-right:6px;cursor:pointer;white-space:nowrap;transition:background .12s}.r:hover{background:var(--sel)}.r.on{background:var(--sel);box-shadow:inset 2px 0 var(--acc)}
.r svg.i{width:16px;height:16px}.nm{overflow:hidden;text-overflow:ellipsis}.ra{margin-left:auto;display:flex;opacity:0;transition:opacity .12s}.r:hover .ra,.r.on .ra{opacity:1}@media(hover:none){.ra{opacity:1}}
.ch{transition:transform .15s}.ch.o{transform:rotate(90deg)}
#ec{flex:1;min-width:0;display:flex;flex-direction:column}
#tw{display:flex;height:35px;background:var(--tab);flex:none}#tabs{flex:1;display:flex;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;color:var(--mut);cursor:pointer;white-space:nowrap;border-right:1px solid var(--bg);transition:background .15s,color .15s}.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 1px var(--acc)}
.tab svg.i{width:14px;height:14px}.tx{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;font-size:11px}.tx:hover{background:#ffffff1f}.tx svg.i{width:12px;height:12px}
#tt{display:flex;align-items:center;padding:0 6px}#tt button{width:30px;height:30px;display:grid;place-items:center;border-radius:4px;transition:background .12s}#tt button:hover{background:#ffffff1f}#br{color:#89d185}#bs{color:#f14c4c}
#ew{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}

#ed{flex:1;display:flex;min-height:0;position:relative}
#gut,#hlp,#ta{font:var(--fs)/var(--lh) var(--mono);tab-size:var(--ts);margin:0;white-space:pre}
#gut{width:54px;flex:none;text-align:right;padding:8px 14px 40vh 0;color:var(--mut);overflow:hidden;user-select:none}
#cw{flex:1;position:relative;min-width:0}
#hlp,#ta{position:absolute;inset:0;padding:8px 12px 40vh;border:0;width:100%;height:100%}
#hlp{overflow:hidden;pointer-events:none;color:var(--fg)}
#ta{overflow:auto;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg);resize:none;outline:0;-webkit-appearance:none;border-radius:0}
#cl{position:absolute;left:0;right:0;top:8px;height:var(--lh);background:#ffffff0d;border-top:1px solid #ffffff0d;border-bottom:1px solid #ffffff0d;pointer-events:none}
::selection{background:#264f78cc}
.c1{color:var(--cm)}.c2{color:var(--st)}.c3{color:var(--nu)}.c4{color:var(--kw)}.c5{color:var(--fn)}[data-l=html] .c5,[data-l=json] .c5{color:var(--at)}[data-l=md] .c4{font-weight:700}
#fwd{position:absolute;top:6px;right:18px;z-index:5;background:var(--side);border:1px solid var(--bd);border-radius:6px;padding:6px;box-shadow:0 4px 16px #0007;transform:translateY(-150%);opacity:0;transition:transform .18s var(--e),opacity .18s;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 28px)}#fwd.on{transform:none;opacity:1}
#fwd div{display:flex;gap:4px;align-items:center}#fwd input[type=text]{width:140px;min-width:0;padding:4px 6px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;outline:0}#fwd input:focus{border-color:var(--acc)}
#fwd button{padding:2px 8px;border-radius:4px;background:var(--sel)}#fwd button:hover{background:var(--acc);color:#fff}#fwd .rp{display:none}#fwd.rr .rp{display:flex}
#pn{height:240px;border-top:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg);overflow:hidden;transition:height .22s var(--e);flex:none}#pn.c{height:0;border-width:0}
#ph{height:34px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px}#ph .pt{padding:6px 8px;font-size:11px;letter-spacing:.05em;color:var(--mut);border-bottom:1px solid transparent;transition:color .15s}#ph .pt.on{color:var(--fg);border-color:var(--fg)}
#ph button:not(.pt){width:24px;height:24px;display:grid;place-items:center;border-radius:4px}#ph button:not(.pt):hover{background:#ffffff1f}#ph svg.i{width:16px;height:16px}
#pb{flex:1;min-height:0;position:relative}.pbx{position:absolute;inset:0;overflow:auto;padding:4px 14px;font:12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}iframe.pbx{padding:0;background:#fff;width:100%;height:100%;border:0}
.er{color:#f14c4c}.wr{color:#cca700}.ok{color:#89d185}.in{color:#75beff}
#tln{display:flex;gap:6px}#pp{color:#89d185;white-space:pre}#ti{flex:1;background:none;border:0;outline:0;font:inherit;color:var(--fg);min-width:0}
#st{background:var(--acc);color:#fff;display:flex;align-items:center;gap:16px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden}#st span{cursor:pointer}#st span:hover{text-decoration:underline}
#pal{position:fixed;top:10%;left:50%;width:min(600px,94vw);transform:translate(-50%,-10px);background:var(--side);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 44px #000a;z-index:30;opacity:0;visibility:hidden;transition:opacity .16s,transform .16s var(--e),visibility 0s .16s;overflow:hidden}
#pal.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .16s,transform .16s var(--e)}
#pin{width:100%;padding:11px 14px;font-size:15px;background:var(--bg);border:0;border-bottom:1px solid var(--bd);outline:0}#pl{max-height:50vh;overflow:auto}.pi{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;cursor:pointer}.pi.on{background:var(--acc);color:#fff}.pi.on .mut{color:#fff9}
#ts{position:fixed;right:14px;bottom:34px;z-index:40;display:flex;flex-direction:column;gap:6px}.t{background:var(--side);border:1px solid var(--bd);border-left:3px solid var(--acc);padding:9px 14px;border-radius:6px;box-shadow:0 6px 20px #0007;animation:up .25s var(--e)}
.fm label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px}select,.si2{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;outline:0}.si2{display:block;width:calc(100% - 20px);margin:6px 10px;padding:7px 8px}.si2:focus{border-color:var(--acc)}.fm p{padding:0 16px;margin:8px 0}.fm .btn{margin:6px 16px;width:calc(100% - 32px)}
.sg{padding:8px 12px 2px;font-size:11px;color:var(--mut)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#79797966;border:2px solid transparent;background-clip:padding-box;border-radius:6px}
@media(max-width:760px){#cc span,#un{display:none}#cc{min-width:0}#sb{position:absolute;left:48px;top:0;bottom:0;width:min(290px,calc(100vw - 48px));box-shadow:6px 0 24px #000a}#sb.c{width:min(290px,calc(100vw - 48px));transform:translateX(-110%);box-shadow:none;border:0;visibility:hidden;transition:transform .22s var(--e),visibility 0s .22s}#sbi{width:100%}#pn{height:42%}#pn.c{height:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* VYRON Android / touch refinement */
#ew{min-width:0}
.ficon{width:17px;height:19px;display:inline-grid;place-items:center;position:relative;flex:none;color:var(--file-color)}
.ficon svg.i{width:16px;height:18px;stroke:var(--file-color)}

#gut{padding-top:8px}
#gut .ln{height:var(--lh);display:block;position:relative;padding-right:14px;box-sizing:border-box}
#gut .ln.err{color:#f48771}
#gut .ln.err:after{content:"";position:absolute;right:3px;top:calc(50% - 4px);width:6px;height:6px;border-radius:50%;background:#f14c4c;box-shadow:0 0 0 2px #f14c4c26}
#ph #pfull{width:34px;height:30px;min-width:34px}
#ph #pfull svg.i{width:17px;height:17px}
#ew{position:relative}

body.native-shell #tm{visibility:hidden}
@media(pointer:coarse){
  button,[role=button],.r,.tab,.pi{touch-action:manipulation}
  button{min-width:42px;min-height:42px}
  #ab button{width:52px;height:52px;min-height:52px}
  #sba button{width:42px;height:42px;min-height:42px}

  .tx{width:30px;height:30px}
  #ph{height:42px}
  #ph .pt{padding:10px 11px;font-size:11px}
  #ph button:not(.pt){width:36px;height:36px}
  #ti,#fq,#fr,#sq,#pin{font-size:16px}

}

  #tb{height:42px;gap:8px;padding:0 10px}

  #ts{left:10px;right:10px;bottom:35px}

  #ide.preview-full #ew{inset:0}
}

</style></head><body>

<script>
const $=s=>document.querySelector(s),LS=localStorage,J=(k,d)=>{try{const v=JSON.parse(LS[k]);return v==null?d:v}catch(e){return d}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nativeCall=(method,args={})=>{try{if(!window.NativeHost||!window.NativeHost.postMessage)return false;window.NativeHost.postMessage(JSON.stringify({method,args}));return true}catch(e){return false}};
const diagnostics=Object.create(null);
